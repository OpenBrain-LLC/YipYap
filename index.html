<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YipYap | app</title>

<link rel="preconnect" href="https://www.youtube-nocookie.com" crossorigin>
<link rel="preconnect" href="https://i.ytimg.com" crossorigin>
<link rel="dns-prefetch" href="https://www.youtube-nocookie.com">
<link rel="dns-prefetch" href="https://i.ytimg.com">

<style>
  :root {
    color-scheme: dark;
    --accent: #ff2e63;
    --accent-2: #4da3ff;
    --accent-3: #ffb347;
    --fg: #fff;
    --shadow: 0 2px 8px rgba(0,0,0,0.85);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; background:#000; overflow:hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior:none;
  }

  /* ---------- satisfaction bar ---------- */
  #satisfaction {
    position:fixed; top:0; left:0; right:0; height:2px;
    background:rgba(255,255,255,0.05);
    z-index:25; pointer-events:none; overflow:hidden;
  }
  #satisfaction-bar {
    position:absolute; inset:0;
    background:linear-gradient(90deg, var(--accent), var(--accent-3), var(--accent-2));
    transform:scaleX(0.5); transform-origin:left;
    transition:transform 0.45s cubic-bezier(0.4,0,0.2,1);
    will-change:transform;
  }

  /* ---------- streak flame ---------- */
  #streak {
    position:fixed;
    top:calc(68px + env(safe-area-inset-top));
    left:14px; z-index:20;
    display:flex; align-items:center; gap:6px;
    padding:6px 11px 6px 9px;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
    font-size:13px; font-weight:800;
    color:#fff;
    opacity:0; transform:translateY(-8px) scale(0.9);
    transition:opacity 0.3s, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events:none;
  }
  #streak.on { opacity:1; transform:translateY(0) scale(1); }
  #streak svg {
    width:16px; height:16px;
    filter:drop-shadow(0 0 8px rgba(255,69,0,0.9));
    animation:flameDance 0.55s ease-in-out infinite alternate;
  }
  @keyframes flameDance {
    from { transform:scale(1) rotate(-4deg); }
    to   { transform:scale(1.18) rotate(4deg); }
  }
  #streak .num {
    background:linear-gradient(180deg, #ff9f43 0%, #ff2e63 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    font-variant-numeric:tabular-nums;
    line-height:1;
    font-size:14px;
    padding-bottom:1px;
  }

  /* ---------- feed ---------- */
  #feed {
    height:100vh; height:100dvh;
    overflow-y:scroll;
    scroll-snap-type: y mandatory;
    overscroll-behavior-y: contain;
    scrollbar-width:none;
    contain: strict;
  }
  #feed::-webkit-scrollbar { display:none; }

  .short {
    position:relative;
    height:100vh; height:100dvh;
    width:100%;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    overflow:hidden;
    background:#000;
    contain: layout paint style;
    animation:slideIn 0.4s ease-out;
  }
  @keyframes slideIn {
    from { opacity:0.5; }
    to   { opacity:1; }
  }

  .short .thumb,
  .short iframe {
    position:absolute; inset:0;
    width:100%; height:100%;
    border:0;
  }
  .short .thumb {
    object-fit:cover;
    filter:brightness(0.68);
    transition:opacity 0.3s;
  }
  .short .thumb.hidden { opacity:0; }

  .short::after {
    content:''; position:absolute;
    left:0; right:0; bottom:0; height:45%;
    background:linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.75) 100%);
    pointer-events:none; z-index:2;
  }

  /* ---------- per-slide progress ---------- */
  .progress {
    position:absolute; left:0; right:0; bottom:0; height:2px;
    background:rgba(255,255,255,0.08);
    z-index:6; pointer-events:none;
    overflow:hidden;
  }
  .progress-fill {
    height:100%; width:0%;
    background:linear-gradient(90deg, var(--accent), var(--accent-3));
    box-shadow:0 0 8px rgba(255,46,99,0.6);
  }
  .short[data-on="1"] .progress-fill {
    animation:progressGrow 30s linear forwards;
  }
  @keyframes progressGrow {
    from { width:0%; }
    to   { width:100%; }
  }

  /* ---------- fallback ---------- */
  .short .fallback {
    position:absolute; inset:0;
    display:none;
    align-items:center; justify-content:center; gap:8px;
    text-align:center; padding:24px;
    color:#fff; font-size:14px; line-height:1.6;
    background:linear-gradient(180deg,#1a1a1a,#000);
    text-decoration:none;
  }
  .short.failed .fallback { display:flex; }
  .short.failed .thumb { opacity:.35; }
  .fallback svg { width:18px; height:18px; }

  /* ---------- meta ---------- */
  .meta {
    position:absolute;
    left:14px;
    right:84px;
    bottom:calc(26px + env(safe-area-inset-bottom));
    color:#fff; z-index:3; pointer-events:none;
    text-shadow:0 1px 6px rgba(0,0,0,0.9);
  }
  .meta .ch {
    font-size:15px; font-weight:800;
    margin-bottom:6px;
    letter-spacing:0.15px;
    display:flex; align-items:center; gap:7px;
  }
  .meta .ch::before {
    content:''; width:6px; height:6px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px var(--accent);
    flex-shrink:0;
  }
  .meta .ti {
    font-size:14px; line-height:1.4;
    opacity:0.95;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  /* ---------- action rail ---------- */
  .actions {
    position:absolute;
    right:10px;
    bottom:calc(92px + env(safe-area-inset-bottom));
    z-index:4;
    display:flex; flex-direction:column;
    gap:18px; align-items:center;
  }
  .act {
    display:flex; flex-direction:column;
    align-items:center; gap:5px;
    background:none; border:0; color:#fff;
    cursor:pointer; padding:0; line-height:0;
    position:relative;
  }
  .act svg {
    width:32px; height:32px;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    transition:transform 0.15s ease;
  }
  .act:active svg { transform:scale(0.85); }
  .act .count {
    font-size:12px; font-weight:700;
    line-height:1;
    text-shadow:0 1px 3px rgba(0,0,0,0.9);
  }
  .act.like.on    { color:var(--accent); }
  .act.dislike.on { color:var(--accent-2); }
  .act.on svg path { fill:currentColor; }

  /* ---------- heart burst ---------- */
  .heart-burst {
    position:fixed;
    font-size:22px;
    color:var(--accent);
    pointer-events:none;
    z-index:50;
    transform:translate(-50%,-50%);
    animation:burst 0.9s cubic-bezier(0.2,0.6,0.3,1) forwards;
    text-shadow:0 0 12px var(--accent);
  }
  @keyframes burst {
    0%   { opacity:1; transform:translate(-50%,-50%) rotate(0deg) scale(0.5); }
    60%  { opacity:1; }
    100% { opacity:0; transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(1.2); }
  }

  /* ---------- top bar ---------- */
  #topbar {
    position:fixed;
    z-index:19;
    top:calc(14px + env(safe-area-inset-top));
    left:14px;
    right:calc(66px + env(safe-area-inset-right));
    height:44px;
    display:flex; align-items:center; gap:8px;
    padding:0 12px;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:22px;
  }
  #topbar .s-icon {
    width:18px; height:18px; flex-shrink:0;
    color:#fff; opacity:0.7;
  }
  #search {
    flex:1; min-width:0;
    background:none; border:0; outline:0;
    color:#fff; font-size:14px; font-family:inherit;
    -webkit-appearance:none; appearance:none;
  }
  #search::placeholder { color:rgba(255,255,255,0.5); }
  #search::-webkit-search-cancel-button { display:none; }
  #topbar .s-count {
    font-size:11px;
    font-variant-numeric:tabular-nums;
    opacity:0.6;
    flex-shrink:0;
    color:#fff;
    display:none;
  }
  #topbar.has-text .s-count { display:inline; }
  #topbar .s-clear {
    width:22px; height:22px; flex-shrink:0;
    padding:0; border:0; cursor:pointer;
    background:rgba(255,255,255,0.18);
    color:#fff; border-radius:50%;
    display:none;
    align-items:center; justify-content:center;
    transition:transform 0.1s;
  }
  #topbar.has-text .s-clear { display:flex; }
  #topbar .s-clear svg { width:12px; height:12px; }
  #topbar .s-clear:active { transform:scale(0.92); }

  /* ---------- empty state ---------- */
  #empty-state {
    position:fixed; inset:0; z-index:15;
    display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:8px;
    padding:24px; text-align:center; color:#fff;
    pointer-events:none;
  }
  #empty-state.show { display:flex; }
  #empty-state .es-title { font-size:18px; font-weight:700; }
  #empty-state .es-query {
    font-size:14px; opacity:0.75; max-width:80%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #empty-state .es-hint { font-size:13px; opacity:0.5; margin-top:10px; }

  /* ---------- mute ---------- */
  #mute {
    position:fixed; z-index:20;
    top:calc(14px + env(safe-area-inset-top)); right:14px;
    width:44px; height:44px; border-radius:50%; border:0;
    background:rgba(0,0,0,0.55); color:#fff;
    cursor:pointer;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    display:flex; align-items:center; justify-content:center;
    transition:transform 0.15s;
  }
  #mute:active { transform:scale(0.92); }
  #mute svg { width:22px; height:22px; }
  #mute .i-on { display:none; }
  #mute.unmuted .i-on  { display:block; }
  #mute.unmuted .i-off { display:none; }
  #mute.unmuted { animation:pulseUnmuted 2.2s ease-in-out infinite; }
  @keyframes pulseUnmuted {
    0%,100% { box-shadow:0 0 0 0 rgba(255,46,99,0.45); }
    50%     { box-shadow:0 0 0 10px rgba(255,46,99,0); }
  }

  /* ---------- swipe hint ---------- */
  #swipe-hint {
    position:fixed;
    bottom:calc(150px + env(safe-area-inset-bottom));
    left:50%; transform:translateX(-50%);
    z-index:18;
    display:flex; flex-direction:column;
    align-items:center; gap:4px;
    color:rgba(255,255,255,0.75);
    font-size:11px; font-weight:600;
    letter-spacing:0.4px;
    pointer-events:none;
    animation:swipeHint 2.2s ease-in-out infinite;
    transition:opacity 0.5s;
    text-transform:uppercase;
  }
  #swipe-hint.hidden { opacity:0; }
  #swipe-hint svg {
    width:20px; height:20px;
    filter:drop-shadow(0 1px 4px rgba(0,0,0,0.8));
  }
  @keyframes swipeHint {
    0%,100% { transform:translateX(-50%) translateY(0);   opacity:0.55; }
    50%     { transform:translateX(-50%) translateY(-8px); opacity:1; }
  }

  /* ---------- loading ---------- */
  #msg {
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:#000; color:#9a9a9a;
    transition:opacity 0.45s;
  }
  #msg.gone { opacity:0; pointer-events:none; }
  .spinner {
    width:26px; height:26px;
    border:2px solid rgba(255,255,255,0.15);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="satisfaction"><div id="satisfaction-bar"></div></div>

<div id="streak">
  <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <path d="M12 2c.5 3 2.5 5 4.5 7 1.5 1.5 2.5 3.5 2.5 6 0 3.5-3 6.5-7 6.5s-7-3-7-6.5c0-2 1-4 2.5-5.5C9.5 8 11 6 12 2zm0 18c1.5 0 3-1 3-2.5 0-1-0.7-1.8-1.5-2.6-.5-.5-1-.9-1.5-1.4-.5.5-1 1-1.5 1.5-.8.8-1.5 1.5-1.5 2.5 0 1.5 1.5 2.5 3 2.5z"/>
  </svg>
  <span class="num">0</span>
</div>

<div id="feed"></div>

<div id="topbar" role="search">
  <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8"/>
    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
  </svg>
  <input id="search" type="search" placeholder="Search" autocomplete="off"
         spellcheck="false" autocorrect="off" autocapitalize="off">
  <span class="s-count" id="scount"></span>
  <button class="s-clear" id="sclear" type="button" aria-label="Clear search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
</div>

<div id="empty-state">
  <div class="es-title">No videos match</div>
  <div class="es-query" id="esquery"></div>
  <div class="es-hint">Try a different search</div>
</div>

<button id="mute" title="Toggle sound" aria-label="Unmute">
  <svg class="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
    <line x1="23" y1="9" x2="17" y2="15"/>
    <line x1="17" y1="9" x2="23" y2="15"/>
  </svg>
  <svg class="i-on" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
  </svg>
</button>

<div id="swipe-hint">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="19" x2="12" y2="5"/>
    <polyline points="5 12 12 5 19 12"/>
  </svg>
  <span>Swipe up</span>
</div>

<div id="msg"><div class="spinner"></div></div>

<script>
(() => {
  "use strict";

  /* ==================================================================
     TUNABLES
     ================================================================== */
  const PRELOAD_COUNT     = 10;
  const BATCH             = 10;
  const MAX_SLIDES        = 64;
  const TRIM_TO           = 40;
  const KEEP_ABOVE        = 18;
  const KEEP_BELOW        = 18;
  const PREFETCH_SCREENS  = 2.5;
  const HISTORY_MAX       = 200;
  const EMBED_TIMEOUT     = 4000;
  const SHARD_CONCURRENCY = 6;

  const WHEEL_THRESHOLD   = 25;
  const WHEEL_COOLDOWN    = 450;
  const SWIPE_FALLBACK    = 0.40;
  const SWIPE_MIN_PX      = 40;
  const SWIPE_MAX_MS      = 300;

  const SEARCH_DEBOUNCE   = 100;

  const CACHE_KEY         = "yipyap.videos.v1";
  const STATE_KEY         = "yipyap.state.v1";
  const STATS_KEY         = "yipyap.stats.v1";
  const SAVE_DEBOUNCE     = 400;
  const SAVE_MAX_W        = 5000;
  const SAVE_MAX_LD       = 2000;

  /* ---- reward function ---- */
  const TAU_PHI      = 5000;
  const T_BOUNCE     = 2500;
  const T_COMPLETE   = 15000;
  const A_LIKE       = 0.9;
  const A_DISLIKE    = -1.2;
  const A_SHARE      = 1.0;
  const A_COMPLETE   = 0.6;
  const A_PHI        = 0.5;
  const A_UNMUTE     = 0.3;
  const A_BOUNCE     = 0.8;
  const BETA_S       = 1.0;
  const MIN_DWELL    = 200;

  /* ---- Beta / Thompson ---- */
  const A0           = 1;
  const B0           = 1;
  const GAMMA_DECAY  = 0.97;
  const KAPPA        = 1 / Math.sqrt(2);

  /* ---- session state ---- */
  const RHO          = 0.30;
  const T_MIN        = 0.6;
  const T_MAX        = 1.8;
  const THETA_S      = 0.25;
  const TAU_S        = 0.35;
  const STREAK_HOT   = 3;
  const STREAK_MULT  = 0.75;

  /* ---- diversity ---- */
  const K_DIV        = 8;
  const GAMMA_DIV    = 0.7;
  const LAMBDA_D     = 1.2;
  const SAME_CH_LIM  = 2;

  /* ---- fatigue ---- */
  const TAU_F        = 12;
  const KAPPA_SAT    = 0.5;
  const LAMBDA_F     = 0.9;

  /* ---- global ---- */
  const LAMBDA_N     = 1.2;
  const SHORTLIST    = 64;

  /* ---- jackpot ---- */
  const P_JACKPOT    = 0.20;
  const ALPHA_J      = 1.5;
  const JACK_CLIP    = 2.5;

  /* ---- override weights ---- */
  const U_LIKE       = 2.0;
  const U_DISLIKE    = 0;
  const U_DEFAULT    = 1.0;

  const LOG_W_MIN    = Math.log(1e-4);
  const LOG_W_MAX    = Math.log(1e3);

  /* ==================================================================
     DOM
     ================================================================== */
  const FEED     = document.getElementById("feed");
  const MSG      = document.getElementById("msg");
  const MUTE     = document.getElementById("mute");
  const TOPBAR   = document.getElementById("topbar");
  const SEARCH   = document.getElementById("search");
  const SCLEAR   = document.getElementById("sclear");
  const SCOUNT   = document.getElementById("scount");
  const EMPTY    = document.getElementById("empty-state");
  const ESQUERY  = document.getElementById("esquery");
  const SAT_BAR  = document.getElementById("satisfaction-bar");
  const STREAK   = document.getElementById("streak");
  const STREAK_N = STREAK.querySelector(".num");
  const SWIPE    = document.getElementById("swipe-hint");

  /* ==================================================================
     SVG
     ================================================================== */
  const SVG_LIKE =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M7 10v12"/>' +
      '<path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>' +
    '</svg>';
  const SVG_DISLIKE =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M17 14V2"/>' +
      '<path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/>' +
    '</svg>';
  const SVG_PLAY =
    '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none">' +
      '<polygon points="6 4 20 12 6 20 6 4"/>' +
    '</svg>';

  /* ==================================================================
     MATH HELPERS
     ================================================================== */
  function randn() {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function pareto() {
    const u = Math.random();
    return Math.min(JACK_CLIP, Math.pow(1 - u, -1 / ALPHA_J) - 1);
  }
  function sigmoid(x) {
    if (x < -40) return 0;
    if (x >  40) return 1;
    return 1 / (1 + Math.exp(-x));
  }
  function hash(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }
  function fmt(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
    return String(n);
  }

  /* ==================================================================
     SAMPLER (Fenwick)
     ================================================================== */
  class Sampler {
    constructor(n) {
      this.n     = n;
      this.base  = new Float64Array(n).fill(1);
      this.live  = new Float64Array(n);
      this.tree  = new Float64Array(n + 1);
      this.total = 0;
      this._reset();
    }
    _add(i, delta) {
      this.total += delta;
      for (let x = i + 1; x <= this.n; x += x & -x) this.tree[x] += delta;
    }
    _reset() {
      this.tree.fill(0);
      this.total = 0;
      for (let i = 0; i < this.n; i++) {
        const w = this.base[i];
        this.live[i] = w;
        if (w > 0) this._add(i, w);
      }
    }
    _find(rem) {
      let idx = 0;
      let bit = 1;
      while ((bit << 1) <= this.n) bit <<= 1;
      for (; bit > 0; bit >>= 1) {
        const nx = idx + bit;
        if (nx <= this.n && this.tree[nx] <= rem) {
          idx  = nx;
          rem -= this.tree[nx];
        }
      }
      return idx >= this.n ? this.n - 1 : idx;
    }
    draw() {
      if (this.total <= 1e-9) this._reset();
      if (this.total <= 1e-9) return -1;
      const idx = this._find(Math.random() * this.total);
      const w   = this.live[idx];
      if (w > 0) {
        this.live[idx] = 0;
        this._add(idx, -w);
        return idx;
      }
      return -1;
    }
    setWeight(i, w) {
      if (i < 0 || i >= this.n) return;
      const nw = w > 0 ? w : 0;
      this.base[i] = nw;
      const old = this.live[i];
      if (old === 0) return;
      if (nw === old) return;
      this.live[i] = nw;
      this._add(i, nw - old);
    }
  }

  /* ==================================================================
     STORE (userWeights, liked, disliked)
     ================================================================== */
  const Store = (() => {
    let idxMap   = new Map();
    let userRef  = null;
    let liked    = new Set();
    let disliked = new Set();
    let dirty    = new Set();
    let timer    = 0;
    let enabled  = true;

    function attach(map, arr) { idxMap = map; userRef = arr; }
    function disable() { enabled = false; }

    function load() {
      if (!enabled) return;
      try {
        const raw = localStorage.getItem(STATE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (!data || data.v !== 1) return;
        if (Array.isArray(data.l)) liked    = new Set(data.l);
        if (Array.isArray(data.d)) disliked = new Set(data.d);
        if (data.w && typeof data.w === "object" && userRef) {
          for (const id in data.w) {
            const i = idxMap.get(id);
            if (i === undefined) continue;
            const val = data.w[id];
            if (typeof val !== "number" || !isFinite(val)) continue;
            userRef[i] = Math.min(U_LIKE, Math.max(U_DISLIKE, val));
            dirty.add(id);
          }
        }
      } catch (e) {
        console.warn("store: load failed", e);
      }
    }

    function markWeight(id) { dirty.add(id); schedule(); }
    function setLiked(id, on) {
      if (on) { liked.add(id); disliked.delete(id); }
      else    { liked.delete(id); }
      schedule();
    }
    function setDisliked(id, on) {
      if (on) { disliked.add(id); liked.delete(id); }
      else    { disliked.delete(id); }
      schedule();
    }
    function isLiked(id)    { return liked.has(id); }
    function isDisliked(id) { return disliked.has(id); }

    function schedule() {
      if (!enabled) return;
      clearTimeout(timer);
      timer = setTimeout(flush, SAVE_DEBOUNCE);
    }

    function flush() {
      if (!enabled || !userRef) return;
      try {
        const w = {};
        for (const id of dirty) {
          const i = idxMap.get(id);
          if (i === undefined) continue;
          const val = userRef[i];
          if (Math.abs(val - U_DEFAULT) > 1e-3) w[id] = val;
        }
        const keys = Object.keys(w);
        if (keys.length > SAVE_MAX_W) {
          const trimmed = {};
          for (let k = keys.length - SAVE_MAX_W; k < keys.length; k++) {
            trimmed[keys[k]] = w[keys[k]];
          }
          for (const kk in w) delete w[kk];
          Object.assign(w, trimmed);
        }
        let l = Array.from(liked);
        let d = Array.from(disliked);
        if (l.length > SAVE_MAX_LD) l = l.slice(-SAVE_MAX_LD);
        if (d.length > SAVE_MAX_LD) d = d.slice(-SAVE_MAX_LD);
        localStorage.setItem(STATE_KEY, JSON.stringify({ v:1, w, l, d }));
      } catch (e) {
        console.warn("store: save failed", e);
      }
    }

    return { attach, load, flush, schedule, disable,
             markWeight, setLiked, setDisliked, isLiked, isDisliked };
  })();

  /* ==================================================================
     IndexedDB
     ================================================================== */
  let _db = null;
  function db() {
    if (_db) return _db;
    _db = new Promise((res, rej) => {
      if (typeof indexedDB === "undefined") return rej(new Error("no idb"));
      const req = indexedDB.open("yipyap", 1);
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains("json")) d.createObjectStore("json");
      };
      req.onsuccess = () => res(req.result);
      req.onerror   = () => rej(req.error);
    });
    return _db;
  }
  async function idbGet(key) {
    try {
      const d = await db();
      return await new Promise((res) => {
        const q = d.transaction("json","readonly").objectStore("json").get(key);
        q.onsuccess = () => res(q.result || null);
        q.onerror   = () => res(null);
      });
    } catch (_) { return null; }
  }
  async function idbSet(key, val) {
    try {
      const d = await db();
      await new Promise((res) => {
        const tx = d.transaction("json","readwrite");
        tx.objectStore("json").put(val, key);
        tx.oncomplete = tx.onerror = tx.onabort = () => res();
      });
    } catch (_) {}
  }

  /* ==================================================================
     STATS (per-item Beta posterior, persisted to IDB)
     ================================================================== */
  const Stats = (() => {
    let idxMap   = new Map();
    let A        = null;
    let B        = null;
    let N        = null;
    let LAST     = null;
    let impCount = 100;          // start high so untouched items = no fatigue
    let dirty    = false;
    let timer    = 0;
    let enabled  = true;
    let nBar     = 1;

    function attach(map, aArr, bArr, nArr, lArr) {
      idxMap = map; A = aArr; B = bArr; N = nArr; LAST = lArr;
    }
    function disable() { enabled = false; }

    async function load() {
      if (!enabled) return;
      const data = await idbGet(STATS_KEY);
      if (!data || data.v !== 1 || !Array.isArray(data.ids)) return;
      for (let k = 0; k < data.ids.length; k++) {
        const i = idxMap.get(data.ids[k]);
        if (i === undefined) continue;
        A[i] = data.a[k];
        B[i] = data.b[k];
        N[i] = data.n[k];
      }
    }

    function decayAll() {
      if (!enabled) return;
      for (let i = 0; i < A.length; i++) {
        A[i] *= GAMMA_DECAY;
        B[i] *= GAMMA_DECAY;
      }
    }

    function update(idx, r) {
      if (!enabled) return;
      if (r > 0) A[idx] += r;
      else if (r < 0) B[idx] += -r;
      N[idx]++;
      LAST[idx] = ++impCount;
      // Recompute nBar lazily
      let sum = 0;
      for (let i = 0; i < N.length; i++) sum += N[i];
      nBar = sum / Math.max(1, N.length);
      dirty = true;
      schedule();
    }

    function schedule() {
      if (!enabled) return;
      clearTimeout(timer);
      timer = setTimeout(flush, SAVE_DEBOUNCE);
    }

    async function flush() {
      if (!enabled || !dirty || !A) return;
      dirty = false;
      try {
        const ids = [], a = [], b = [], n = [];
        for (let i = 0; i < A.length; i++) {
          ids.push(pool[i].id);
          a.push(A[i]);
          b.push(B[i]);
          n.push(N[i]);
        }
        await idbSet(STATS_KEY, { v:1, ids, a, b, n });
      } catch (_) {}
    }

    return {
      attach, load, update, flush, decayAll, disable,
      get A() { return A; },
      get B() { return B; },
      get N() { return N; },
      get LAST() { return LAST; },
      get impCount() { return impCount; },
      get nBar() { return nBar; }
    };
  })();

  /* ==================================================================
     HAZARD MODEL (tiny logistic, persisted)
     ================================================================== */
  const Hazard = (() => {
    let beta = [0, 0, 0, 0, 0, 0];
    let enabled = true;

    function load() {
      if (!enabled) return;
      try {
        const raw = localStorage.getItem("yipyap.hazard.v1");
        if (!raw) return;
        const p = JSON.parse(raw);
        if (Array.isArray(p) && p.length === 6) beta = p;
      } catch (_) {}
    }
    function save() {
      if (!enabled) return;
      try { localStorage.setItem("yipyap.hazard.v1", JSON.stringify(beta)); }
      catch (_) {}
    }
    function features(S, k, hasSearch, t) {
      return [1, S, k, S * k, hasSearch ? 1 : 0, Math.log(1 + t / 1000)];
    }
    function predict(x) {
      let z = 0;
      for (let i = 0; i < x.length; i++) z += beta[i] * x[i];
      return sigmoid(z);
    }
    function train(x, y) {
      const h = predict(x);
      const err = y - h;
      for (let i = 0; i < x.length; i++) beta[i] += 0.02 * err * x[i];
    }
    function disable() { enabled = false; }

    return { load, save, features, predict, train, disable };
  })();

  /* ==================================================================
     BOUNDED CONCURRENCY
     ================================================================== */
  function mapLimit(items, limit, fn) {
    return new Promise((resolve, reject) => {
      const n = items.length;
      if (!n) return resolve();
      let i = 0, running = 0, done = 0, failed = false;
      (function next() {
        if (failed) return;
        while (running < limit && i < n) {
          const k = i++;
          running++;
          Promise.resolve(fn(items[k], k)).then(() => {
            running--; done++;
            if (done === n) resolve(); else next();
          }, (e) => { failed = true; reject(e); });
        }
      })();
    });
  }

  /* ==================================================================
     LOADER
     ================================================================== */
  async function loadVideos() {
    const hit = await idbGet(CACHE_KEY);
    if (Array.isArray(hit) && hit.length) return { list: hit, source: "cache" };

    const res = await fetch("video.json", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    let list;
    if (Array.isArray(data)) {
      list = data;
    } else if (data && Array.isArray(data.shards) && data.shards.length) {
      const parts = new Array(data.shards.length);
      await mapLimit(data.shards, SHARD_CONCURRENCY, async (url, i) => {
        const r = await fetch(url, { cache: "force-cache" });
        if (!r.ok) throw new Error("shard " + url + " HTTP " + r.status);
        parts[i] = await r.json();
      });
      list = [];
      for (const p of parts) {
        if (!Array.isArray(p)) continue;
        for (let k = 0; k < p.length; k++) list.push(p[k]);
      }
    } else {
      throw new Error("video.json must be an array or { shards: [...] }");
    }
    if (!list.length) throw new Error("no videos found");

    idbSet(CACHE_KEY, list);
    return { list, source: "network" };
  }

  const DEMO = [
    { id:"aqz-KE-bpKQ", title:"Big Buck Bunny",          channel:"Blender",     thumbnail:"https://i.ytimg.com/vi/aqz-KE-bpKQ/hqdefault.jpg" },
    { id:"jNQXAC9IVRw", title:"Me at the zoo",           channel:"jawed",       thumbnail:"https://i.ytimg.com/vi/jNQXAC9IVRw/hqdefault.jpg" },
    { id:"9bZkp7q19f0", title:"Gangnam Style",           channel:"officialpsy", thumbnail:"https://i.ytimg.com/vi/9bZkp7q19f0/hqdefault.jpg" },
    { id:"dQw4w9WgXcQ", title:"Never Gonna Give You Up", channel:"Rick Astley", thumbnail:"https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg" }
  ];

  /* ==================================================================
     STATE
     ================================================================== */
  let pool         = [];
  let sampler      = null;
  let userWeights  = null;
  let searchScores = null;
  let searchCount  = 0;
  let haystack     = null;
  let titleLower   = null;
  let channelLower = null;
  let titleTokens  = null;
  let muted        = true;
  const history    = [];
  let shortlist    = [];
  const recent     = [];

  const Session = {
    k: 0,
    S: 0,
    streak: 0
  };

  /* ==================================================================
     SEARCH
     ================================================================== */
  function buildHaystack() {
    const n = pool.length;
    haystack     = new Array(n);
    titleLower   = new Array(n);
    channelLower = new Array(n);
    titleTokens  = new Array(n);
    for (let i = 0; i < n; i++) {
      const v = pool[i];
      const t = (v.title   || "").toLowerCase();
      const c = (v.channel || "").toLowerCase();
      titleLower[i]   = t;
      channelLower[i] = c;
      haystack[i] = t + " " + c + " " + v.id;
      const words = t.split(/\s+/).filter(w => w.length > 2);
      titleTokens[i] = new Set(words);
    }
  }

  function searchVideos(q) {
    const query = q.toLowerCase();
    const tokens = query.split(/\s+/).filter(Boolean);
    const scores = new Float32Array(pool.length);
    let count = 0;
    if (!tokens.length) return { scores, count: 0 };

    for (let i = 0; i < pool.length; i++) {
      const hay = haystack[i];
      let ok = true;
      for (let t = 0; t < tokens.length; t++) {
        if (hay.indexOf(tokens[t]) === -1) { ok = false; break; }
      }
      if (!ok) continue;

      const title = titleLower[i];
      const chan  = channelLower[i];
      let s = 1;
      if (title === query)                  s += 5;
      else if (title.startsWith(query))     s += 3;
      else if (title.indexOf(query) !== -1) s += 2;
      if (chan.startsWith(query))           s += 1.5;
      else if (chan.indexOf(query) !== -1)  s += 0.75;
      if (pool[i].id === query)             s += 4;

      scores[i] = s;
      count++;
    }
    return { scores, count };
  }

  /* ==================================================================
     WEIGHT COMPUTATION
     ================================================================== */
  function staticLogWeight(i) {
    const uw = userWeights[i];
    if (uw === U_DISLIKE) return -Infinity;
    if (searchScores && searchScores[i] <= 0) return -Infinity;
    if (!Stats.A) return Math.log(uw);

    let lw = Math.log(uw);
    lw += KAPPA * Math.log(Stats.A[i] / Stats.B[i]);
    if (Stats.N[i] === 0) lw += LAMBDA_N;
    if (searchScores) lw += Math.log(searchScores[i]);
    return lw;
  }

  function staticWeight(i) {
    const lw = staticLogWeight(i);
    if (lw === -Infinity) return 0;
    return Math.exp(Math.max(LOG_W_MIN, Math.min(LOG_W_MAX, lw)));
  }

  function syncSampler() {
    const n = sampler.n;
    for (let i = 0; i < n; i++) sampler.base[i] = staticWeight(i);
    sampler._reset();
    shortlist = [];
  }

  /* ==================================================================
     DIVERSITY
     ================================================================== */
  function similarity(i, j) {
    let s = 0;
    if (pool[i].channel === pool[j].channel) s += 1;
    const ti = titleTokens[i], tj = titleTokens[j];
    if (ti.size > 0 || tj.size > 0) {
      let inter = 0;
      for (const w of ti) if (tj.has(w)) inter++;
      const union = ti.size + tj.size - inter;
      if (union > 0) s += 0.5 * (inter / union);
    }
    return s;
  }

  function diversityPenalty(i) {
    const m = Math.min(K_DIV, recent.length);
    if (m === 0) return 0;
    let num = 0, den = 0;
    for (let k = 0; k < m; k++) {
      const j = recent[recent.length - 1 - k];
      const w = Math.pow(GAMMA_DIV, k);
      num += w * similarity(i, j);
      den += w;
    }
    return den > 0 ? num / den : 0;
  }

  function sameChannelBlocked(i) {
    if (recent.length < SAME_CH_LIM) return false;
    const a = recent[recent.length - 1];
    const b = recent[recent.length - 2];
    return pool[i].channel === pool[a].channel &&
           pool[i].channel === pool[b].channel;
  }

  /* ==================================================================
     FATIGUE
     ================================================================== */
  function fatiguePenalty(i) {
    const lastSeen = Stats.LAST[i];
    const delta = Stats.impCount - lastSeen;
    const recency = Math.exp(-delta / TAU_F);
    const nBar = Math.max(1, Stats.nBar);
    const saturation = KAPPA_SAT * Math.max(0, Stats.N[i] / nBar - 1);
    return recency + saturation;
  }

  /* ==================================================================
     TEMPERATURE
     ================================================================== */
  function currentTemp() {
    const s = Session.S;
    const g = sigmoid((s - THETA_S) / TAU_S);
    let T = T_MIN + (T_MAX - T_MIN) * (1 - g);
    if (Session.streak >= STREAK_HOT) T *= STREAK_MULT;
    return T;
  }

  /* ==================================================================
     SHORTLIST + DRAW
     ================================================================== */
  function refillShortlist() {
    shortlist = [];
    const M = Math.min(SHORTLIST, sampler.n);
    for (let i = 0; i < M; i++) {
      const idx = sampler.draw();
      if (idx < 0) break;
      if (staticWeight(idx) > 0) shortlist.push(idx);
    }
  }

  function nextItem() {
    if (shortlist.length < Math.max(1, Math.floor(SHORTLIST / 4))) {
      refillShortlist();
    }
    if (shortlist.length === 0) {
      sampler._reset();
      refillShortlist();
    }
    if (shortlist.length === 0) return -1;

    const T = currentTemp();
    const isJackpot = Math.random() < P_JACKPOT;

    const scored = [];
    for (const idx of shortlist) {
      if (sameChannelBlocked(idx)) continue;
      const base = staticLogWeight(idx);
      if (base === -Infinity) continue;
      const sd = Math.sqrt(1 / Stats.A[idx] + 1 / Stats.B[idx]);
      let lw = base + (KAPPA * sd * randn()) / T;
      lw -= LAMBDA_D * diversityPenalty(idx);
      lw -= LAMBDA_F * fatiguePenalty(idx);
      scored.push({ idx, lw });
    }

    if (scored.length === 0) {
      recent.length = 0;
      for (const idx of shortlist) {
        if (staticLogWeight(idx) > -Infinity) {
          const pos = shortlist.indexOf(idx);
          if (pos >= 0) shortlist.splice(pos, 1);
          recent.push(idx);
          if (recent.length > K_DIV) recent.shift();
          return idx;
        }
      }
      return -1;
    }

    if (isJackpot) {
      scored.sort((x, y) => y.lw - x.lw);
      const topN = Math.max(1, Math.ceil(scored.length / 10));
      for (let k = 0; k < topN; k++) scored[k].lw += pareto();
    }

    let maxLw = -Infinity;
    for (const s of scored) if (s.lw > maxLw) maxLw = s.lw;
    let total = 0;
    const ws = new Array(scored.length);
    for (let k = 0; k < scored.length; k++) {
      ws[k] = Math.exp(scored[k].lw - maxLw);
      total += ws[k];
    }

    let r = Math.random() * total;
    let pick = scored[scored.length - 1].idx;
    for (let k = 0; k < scored.length; k++) {
      r -= ws[k];
      if (r <= 0) { pick = scored[k].idx; break; }
    }

    const pos = shortlist.indexOf(pick);
    if (pos >= 0) shortlist.splice(pos, 1);

    recent.push(pick);
    if (recent.length > K_DIV) recent.shift();

    return pick;
  }

  /* ==================================================================
     IMPRESSION TRACKING
     ================================================================== */
  function computeReward(slide, t) {
    const liked    = slide._liked    ? 1 : 0;
    const disliked = slide._disliked ? 1 : 0;
    const shared   = slide._impShare ? 1 : 0;
    const unmuted  = slide._impUnmute ? 1 : 0;

    const Phi = 1 - Math.exp(-t / TAU_PHI);
    const c   = Math.min(1, t / T_COMPLETE);
    const B   = Math.max(0, 1 - t / T_BOUNCE);

    const raw =
      A_LIKE * liked +
      A_DISLIKE * disliked +
      A_SHARE * shared +
      A_COMPLETE * c +
      A_PHI * Phi +
      A_UNMUTE * unmuted -
      A_BOUNCE * B;

    return Math.tanh(BETA_S * raw);
  }

  function closeImpression(slide) {
    if (!slide || !slide._impStart) return;
    const t = performance.now() - slide._impStart;
    slide._impStart = 0;

    if (t < MIN_DWELL) return;
    if (slide.classList.contains("failed")) return;

    const idx = slide._impIdx;
    if (idx === undefined) return;

    const r = computeReward(slide, t);

    // Train hazard model
    const x = Hazard.features(Session.S, Session.k, !!searchScores, t);
    Hazard.train(x, r > 0 ? 1 : 0);

    // Update rolling satisfaction
    Session.S = (1 - RHO) * Session.S + RHO * r;

    // Update streak
    if (r > 0.5)      Session.streak++;
    else if (r < 0)   Session.streak = 0;

    // Update item posterior
    Stats.update(idx, r);

    // Update sampler weight for this item
    sampler.setWeight(idx, staticWeight(idx));

    // Update UI
    updateStreakUI();
    updateSatisfactionUI();

    Session.k++;
  }

  /* ==================================================================
     UI STATE
     ================================================================== */
  function updateStreakUI() {
    if (Session.streak >= 2) {
      STREAK.classList.add("on");
      STREAK_N.textContent = Session.streak;
    } else {
      STREAK.classList.remove("on");
    }
  }

  function updateSatisfactionUI() {
    const norm = (Session.S + 1) / 2;
    const clamped = Math.max(0.02, Math.min(1, norm));
    SAT_BAR.style.transform = "scaleX(" + clamped + ")";
  }

  function burstHearts(button) {
    const rect = button.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    for (let i = 0; i < 8; i++) {
      const el = document.createElement("div");
      el.className = "heart-burst";
      el.textContent = "❤";
      el.style.left = cx + "px";
      el.style.top  = cy + "px";
      el.style.setProperty("--dx",  ((Math.random() - 0.5) * 120) + "px");
      el.style.setProperty("--dy",  (-40 - Math.random() * 80) + "px");
      el.style.setProperty("--rot", ((Math.random() - 0.5) * 90) + "deg");
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 950);
    }
  }

  /* ==================================================================
     FEED RESET
     ================================================================== */
  function resetFeed() {
    let el = FEED.firstChild;
    while (el) {
      const next = el.nextSibling;
      io.unobserve(el);
      el._cleanup?.();
      el.remove();
      el = next;
    }
    history.length  = 0;
    shortlist       = [];
    FEED.scrollTop  = 0;
    if (searchCount > 0) appendBatch(PRELOAD_COUNT, true);
  }

  /* ==================================================================
     INTERSECTION OBSERVER
     ================================================================== */
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (e.isIntersecting) activate(e.target);
      else                  deactivate(e.target);
    }
  }, { root: FEED, threshold: 0.7 });

  /* ==================================================================
     SLIDE FACTORY
     ================================================================== */
  function makeSlide(v, idx, eager) {
    const s = document.createElement("section");
    s.className  = "short";
    s.dataset.id = v.id;
    s._idx       = idx;
    s._impStart  = 0;
    s._impShare  = false;
    s._impUnmute = false;

    const img = document.createElement("img");
    img.className = "thumb";
    img.alt       = "";
    img.decoding  = "async";
    if (eager) {
      img.loading       = "eager";
      img.fetchPriority = "high";
    } else {
      img.loading       = "lazy";
      img.fetchPriority = "low";
    }
    img.src = v.thumbnail || ("https://i.ytimg.com/vi/" + v.id + "/hqdefault.jpg");
    s.appendChild(img);

    const fb = document.createElement("a");
    fb.className = "fallback";
    fb.href      = "https://www.youtube.com/watch?v=" + v.id;
    fb.target    = "_blank";
    fb.rel       = "noopener";
    fb.innerHTML = SVG_PLAY + "<span>Watch on YouTube</span>";
    fb.addEventListener("click", () => { s._impShare = true; });
    s.appendChild(fb);

    const meta = document.createElement("div");
    meta.className = "meta";
    const ch = document.createElement("div"); ch.className = "ch";
    const ti = document.createElement("div"); ti.className = "ti";
    ch.textContent = v.channel || "";
    ti.textContent = v.title   || "";
    meta.append(ch, ti);
    s.appendChild(meta);

    const rail = document.createElement("div");
    rail.className = "actions";

    const likeBtn = document.createElement("button");
    likeBtn.type  = "button";
    likeBtn.className = "act like";
    likeBtn.setAttribute("aria-label", "Like");
    likeBtn.innerHTML = SVG_LIKE + '<span class="count"></span>';

    const disBtn = document.createElement("button");
    disBtn.type  = "button";
    disBtn.className = "act dislike";
    disBtn.setAttribute("aria-label", "Dislike");
    disBtn.innerHTML = SVG_DISLIKE + '<span class="count"></span>';

    rail.append(likeBtn, disBtn);
    s.appendChild(rail);

    const prog = document.createElement("div");
    prog.className = "progress";
    prog.innerHTML = '<div class="progress-fill"></div>';
    s.appendChild(prog);

    s._liked    = Store.isLiked(v.id);
    s._disliked = Store.isDisliked(v.id);

    const baseLike    = 800 + (hash(v.id)        % 48000);
    const baseDislike = 20  + (hash(v.id + "#d") % 900);
    s._likeCount    = baseLike    + (s._liked    ? 1 : 0);
    s._dislikeCount = baseDislike + (s._disliked ? 1 : 0);

    const likeCountEl = likeBtn.querySelector(".count");
    const disCountEl  = disBtn.querySelector(".count");

    function render() {
      likeBtn.classList.toggle("on", s._liked);
      disBtn .classList.toggle("on", s._disliked);
      likeCountEl.textContent = fmt(s._likeCount);
      disCountEl .textContent = fmt(s._dislikeCount);
      likeBtn.setAttribute("aria-pressed", s._liked    ? "true" : "false");
      disBtn .setAttribute("aria-pressed", s._disliked ? "true" : "false");
    }
    render();

    function setUserWeight(m) {
      userWeights[idx] = m;
      if (sampler) sampler.setWeight(idx, staticWeight(idx));
      Store.markWeight(v.id);
    }

    likeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (s._liked) {
        s._liked = false;
        s._likeCount = Math.max(0, s._likeCount - 1);
        Store.setLiked(v.id, false);
        setUserWeight(U_DEFAULT);
      } else {
        s._liked = true;
        s._likeCount += 1;
        if (s._disliked) {
          s._disliked = false;
          s._dislikeCount = Math.max(0, s._dislikeCount - 1);
          Store.setDisliked(v.id, false);
        }
        Store.setLiked(v.id, true);
        setUserWeight(U_LIKE);
        burstHearts(likeBtn);
      }
      render();
    });

    disBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (s._disliked) {
        s._disliked = false;
        s._dislikeCount = Math.max(0, s._dislikeCount - 1);
        Store.setDisliked(v.id, false);
        setUserWeight(U_DEFAULT);
      } else {
        s._disliked = true;
        s._dislikeCount += 1;
        if (s._liked) {
          s._liked = false;
          s._likeCount = Math.max(0, s._likeCount - 1);
          Store.setLiked(v.id, false);
        }
        Store.setDisliked(v.id, true);
        setUserWeight(U_DISLIKE);
      }
      render();
    });

    io.observe(s);
    return s;
  }

  /* ==================================================================
     ACTIVATE / DEACTIVATE
     ================================================================== */
  function activate(slide) {
    if (slide.dataset.on === "1") return;
    slide.dataset.on = "1";

    // Start impression
    slide._impStart  = performance.now();
    slide._impIdx    = slide._idx;
    slide._impShare  = false;
    slide._impUnmute = false;

    const id = slide.dataset.id;
    const origin = (location.protocol === "http:" || location.protocol === "https:")
      ? location.origin : "";

    const params = new URLSearchParams({
      autoplay:"1", mute:"1", loop:"1", playlist:id,
      controls:"0", modestbranding:"1", rel:"0",
      playsinline:"1", iv_load_policy:"3", fs:"0"
    });
    if (origin) {
      params.set("origin", origin);
      params.set("enablejsapi", "1");
    }

    const frame = document.createElement("iframe");
    frame.setAttribute("allow", "autoplay; encrypted-media; picture-in-picture");
    frame.setAttribute("allowfullscreen", "");
    frame.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
    frame.src = "https://www.youtube-nocookie.com/embed/" + id + "?" + params.toString();

    let ready = false;
    const onReady = (e) => {
      if (e.source !== frame.contentWindow) return;
      try {
        const d = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
        if (d && (d.event === "onReady" || d.event === "initialDelivery")) {
          ready = true;
          slide.querySelector(".thumb")?.classList.add("hidden");
        }
      } catch (_) {}
    };
    window.addEventListener("message", onReady);

    frame.addEventListener("load", () => {
      if (!muted) setTimeout(() => cmd(frame, "unMute"), 400);
    });

    const timer = setTimeout(() => {
      if (!ready) slide.classList.add("failed");
    }, EMBED_TIMEOUT);

    slide._cleanup = () => {
      clearTimeout(timer);
      window.removeEventListener("message", onReady);
    };

    slide.appendChild(frame);
  }

  function deactivate(slide) {
    if (slide.dataset.on !== "1") return;
    slide.dataset.on = "0";
    closeImpression(slide);
    slide._cleanup?.();
    slide.querySelector("iframe")?.remove();
    slide.querySelector(".thumb")?.classList.remove("hidden");
    slide.classList.remove("failed");
  }

  function cmd(frame, func, args = []) {
    try {
      frame.contentWindow.postMessage(
        JSON.stringify({ event:"command", func, args }), "*"
      );
    } catch (_) {}
  }

  /* ==================================================================
     BATCH APPEND
     ================================================================== */
  function appendBatch(n = BATCH, eager = false) {
    if (searchCount === 0) return;
    const frag = document.createDocumentFragment();
    for (let i = 0; i < n; i++) {
      const idx = nextItem();
      if (idx < 0) break;
      frag.appendChild(makeSlide(pool[idx], idx, eager));
    }
    FEED.appendChild(frag);
  }

  /* ==================================================================
     VIRTUALIZATION
     ================================================================== */
  function trim() {
    const kids = FEED.children;
    const n    = kids.length;
    if (n <= MAX_SLIDES) return;

    const h = FEED.clientHeight || 1;
    const topIdx = Math.round(FEED.scrollTop / h);
    const removable = Math.min(topIdx - KEEP_ABOVE, n - TRIM_TO);
    if (removable <= 0) return;

    const doomed = [];
    for (let i = 0; i < removable && i < n; i++) {
      const el = kids[i];
      if (el.dataset.on === "1") break;
      doomed.push(el);
    }
    if (!doomed.length) return;

    const prevTop = FEED.scrollTop;
    for (const el of doomed) {
      io.unobserve(el);
      el._cleanup?.();
      if (history.length < HISTORY_MAX) history.push(el._idx);
      el.remove();
    }
    FEED.scrollTop = Math.max(0, prevTop - doomed.length * h);
  }

  function prependFromHistory() {
    if (!history.length) return;
    if (FEED.children.length >= MAX_SLIDES) return;

    const h = FEED.clientHeight || 1;
    if (FEED.scrollTop > h * 3) return;

    const take   = Math.min(BATCH, history.length);
    const picked = [];
    for (let i = 0; i < take; i++) picked.push(history.pop());
    picked.reverse();

    const prevTop = FEED.scrollTop;
    const frag = document.createDocumentFragment();
    for (const idx of picked) frag.appendChild(makeSlide(pool[idx], idx, false));
    FEED.insertBefore(frag, FEED.firstChild);
    FEED.scrollTop = prevTop + picked.length * h;
  }

  /* ==================================================================
     SCROLL
     ================================================================== */
  function maybeAppend() {
    const remaining = FEED.scrollHeight - (FEED.scrollTop + FEED.clientHeight);
    if (remaining > FEED.clientHeight * PREFETCH_SCREENS) return;
    appendBatch();
  }

  let ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      prependFromHistory();
      trim();
      maybeAppend();
    });
  }

  /* ==================================================================
     NAVIGATION
     ================================================================== */
  function go(dir) {
    const h = FEED.clientHeight || 1;
    if (dir > 0) {
      const remaining = FEED.scrollHeight - FEED.scrollTop - h;
      if (remaining < h * 1.5) appendBatch();
    } else if (dir < 0) {
      if (FEED.scrollTop < h * 2) prependFromHistory();
    }
    FEED.scrollBy({ top: dir * h, behavior: "smooth" });
  }

  window.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" ||
        (e.target && e.target.isContentEditable)) {
      if (e.key === "Escape" && e.target === SEARCH) SEARCH.blur();
      return;
    }
    switch (e.key) {
      case "ArrowDown": case "PageDown": case "j":
        e.preventDefault(); go(1); break;
      case "ArrowUp":   case "PageUp":   case "k":
        e.preventDefault(); go(-1); break;
      case "Home":
        e.preventDefault();
        FEED.scrollTo({ top: 0, behavior: "smooth" });
        break;
      case "End":
        e.preventDefault();
        while (FEED.scrollHeight - FEED.scrollTop - FEED.clientHeight < FEED.clientHeight * 2) {
          appendBatch();
        }
        FEED.scrollTo({ top: FEED.scrollHeight, behavior: "smooth" });
        break;
    }
  });

  let wheelLock = 0;
  window.addEventListener("wheel", (e) => {
    if (e.target && e.target.tagName === "INPUT") return;
    if (Math.abs(e.deltaY) < WHEEL_THRESHOLD) return;
    e.preventDefault();
    const now = performance.now();
    if (now - wheelLock < WHEEL_COOLDOWN) return;
    wheelLock = now;
    go(e.deltaY > 0 ? 1 : -1);
  }, { passive: false });

  let tStartY = 0, tStartScroll = 0, tStartTime = 0;
  FEED.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) return;
    tStartY      = e.touches[0].clientY;
    tStartScroll = FEED.scrollTop;
    tStartTime   = performance.now();
  }, { passive: true });

  FEED.addEventListener("touchend", (e) => {
    if (e.changedTouches.length !== 1) return;
    const dy = e.changedTouches[0].clientY - tStartY;
    const dt = performance.now() - tStartTime;
    const h  = FEED.clientHeight || 1;
    const moved = Math.abs(FEED.scrollTop - tStartScroll);
    if (moved > h * SWIPE_FALLBACK) return;
    const quick = dt < SWIPE_MAX_MS && Math.abs(dy) > SWIPE_MIN_PX;
    const big   = Math.abs(dy) > 100;
    if (!quick && !big) return;
    go(dy < 0 ? 1 : -1);
  }, { passive: true });

  /* ==================================================================
     MUTE
     ================================================================== */
  MUTE.addEventListener("click", () => {
    muted = !muted;
    MUTE.classList.toggle("unmuted", !muted);
    MUTE.setAttribute("aria-label", muted ? "Unmute" : "Mute");
    if (!muted) {
      // Mark that user unmuted — will count toward reward on active slide
      FEED.querySelectorAll('.short[data-on="1"]').forEach(s => {
        s._impUnmute = true;
      });
    }
    FEED.querySelectorAll(".short iframe")
      .forEach(f => cmd(f, muted ? "mute" : "unMute"));
  });

  /* ==================================================================
     SEARCH UI
     ================================================================== */
  let searchTimer = 0;
  let lastQuery   = "";

  function updateSearchChrome(active) {
    TOPBAR.classList.toggle("has-text", active);
    if (active && searchCount > 0) SCOUNT.textContent = String(searchCount);
    else                          SCOUNT.textContent = "";
  }
  function updateEmptyState(show, q) {
    if (show) {
      ESQUERY.textContent = q ? ('"' + q + '"') : "";
      EMPTY.classList.add("show");
    } else {
      EMPTY.classList.remove("show");
    }
  }

  function runSearch(q) {
    const norm = q.trim();
    if (norm === lastQuery) return;
    lastQuery = norm;

    if (!norm) {
      searchScores = null;
      searchCount  = pool.length;
      updateEmptyState(false);
      updateSearchChrome(false);
    } else {
      const res = searchVideos(norm);
      searchScores = res.scores;
      searchCount  = res.count;
      updateEmptyState(res.count === 0, norm);
      updateSearchChrome(true);
    }
    syncSampler();
    resetFeed();
  }

  SEARCH.addEventListener("input", () => {
    const val = SEARCH.value;
    TOPBAR.classList.toggle("has-text", !!val);
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => runSearch(val), SEARCH_DEBOUNCE);
  });

  SEARCH.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      clearTimeout(searchTimer);
      runSearch(SEARCH.value);
      SEARCH.blur();
    }
  });

  SCLEAR.addEventListener("click", () => {
    SEARCH.value = "";
    TOPBAR.classList.remove("has-text");
    clearTimeout(searchTimer);
    runSearch("");
    SEARCH.focus();
  });

  /* ==================================================================
     BANNER
     ================================================================== */
  function banner(text, color) {
    const el = document.createElement("div");
    el.style.cssText =
      "position:fixed;left:12px;bottom:calc(10px + env(safe-area-inset-bottom));" +
      "z-index:30;background:" + (color || "rgba(255,0,0,0.85)") + ";color:#fff;" +
      "padding:6px 10px;border-radius:6px;font-size:12px;pointer-events:none";
    el.textContent = text;
    document.body.appendChild(el);
  }

  /* ==================================================================
     BOOT
     ================================================================== */
  (async function boot() {
    const t0 = performance.now();

    /* ---- load list ---- */
    let list, source = "network", note = "";
    try {
      if (location.protocol === "file:") throw new Error("file:// blocks fetch");
      const out = await loadVideos();
      list   = out.list;
      source = out.source;
    } catch (err) {
      list   = DEMO;
      source = "demo";
      note   = err.message;
      console.warn("Demo fallback:", err.message);
    }
    pool = list;

    /* ---- build indices ---- */
    buildHaystack();

    /* ---- per-item state ---- */
    userWeights = new Float64Array(pool.length).fill(U_DEFAULT);
    const idxMap = new Map();
    for (let i = 0; i < pool.length; i++) idxMap.set(pool[i].id, i);

    const A    = new Float32Array(pool.length).fill(A0);
    const B    = new Float32Array(pool.length).fill(B0);
    const N    = new Uint32Array(pool.length);
    const LAST = new Uint32Array(pool.length);

    /* ---- persistence ---- */
    try {
      if (location.protocol === "file:") {
        Store.disable();
        Stats.disable();
        Hazard.disable();
      } else {
        Store.attach(idxMap, userWeights);
        Store.load();
        Stats.attach(idxMap, A, B, N, LAST);
        await Stats.load();
        Stats.decayAll();
        Hazard.load();
      }
    } catch (_) {
      Store.disable();
      Stats.disable();
      Hazard.disable();
    }

    /* ---- sampler ---- */
    sampler = new Sampler(pool.length);
    searchScores = null;
    searchCount  = pool.length;
    syncSampler();

    /* ---- first paint ---- */
    MSG.classList.add("gone");
    setTimeout(() => MSG.remove(), 500);

    appendBatch(PRELOAD_COUNT, true);
    FEED.addEventListener("scroll", onScroll, { passive: true });

    // Hide swipe hint once user scrolls
    let hintHidden = false;
    FEED.addEventListener("scroll", () => {
      if (!hintHidden && FEED.scrollTop > 20) {
        hintHidden = true;
        SWIPE.classList.add("hidden");
      }
    }, { passive: true });

    /* ---- persistence on hide ---- */
    const flushAll = () => {
      Store.flush();
      Stats.flush();
      Hazard.save();
    };
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        FEED.querySelectorAll('.short[data-on="1"]').forEach(closeImpression);
        flushAll();
      }
    });
    window.addEventListener("pagehide", flushAll);

    const ms = Math.round(performance.now() - t0);
    console.info(
      "YipYap ready: " + pool.length + " videos from " + source +
      " in " + ms + "ms"
    );

    if (source === "demo") {
      banner("Demo mode — serve over http:// to load video.json (" + note + ")");
    }
  })();
})();
</script>
</body>
</html>
